name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.VF_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/vf.jks"
            echo "VF_KEYSTORE_FILE=$RUNNER_TEMP/vf.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No VF_KEYSTORE_B64 secret, so this build uses a throwaway debug key."
          fi

      - name: Build
        env:
          VF_KEYSTORE_PASSWORD: ${{ secrets.VF_KEYSTORE_PASSWORD }}
          VF_KEY_ALIAS: ${{ secrets.VF_KEY_ALIAS }}
          VF_KEY_PASSWORD: ${{ secrets.VF_KEY_PASSWORD }}
          VF_VERSION_CODE: ${{ github.run_number }}
        run: |
          gradle --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "VenusFlyHQ-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: VenusFlyHQ-apk
          path: VenusFlyHQ-*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" VenusFlyHQ-*.apk \
            --title "Venus Fly HQ 1.0.${{ github.run_number }}" \
            --notes "Tap the .apk below on your phone or tablet to install or update." --latest
